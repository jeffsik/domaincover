[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jeffsik-domaincover"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对训练数据的领域覆盖缺口相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jeffsik" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jeffsik.github.io"
Repository = "https://github.com/jeffsik/domaincover"
Issues = "https://github.com/jeffsik/domaincover/issues"

[project.scripts]
domaincover = "domaincover:main"

[tool.setuptools]
py-modules = ["domaincover"]
